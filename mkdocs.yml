site_name: robo-automation
site_description: Generic Playwright and pytest automation framework utilities
copyright: Copyright &copy; 2026 Dinil Mithra

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.] 
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_object_full_path: false
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            inherited_members: false
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - toc

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Core Concepts: getting-started/concepts.md
      - Pytest Fixtures: getting-started/pytest-fixtures.md
  - Guides:
      - Framework Architecture: guides/framework-architecture.md
      - Extending the Page Layer: guides/extending-page-layer.md
      - Performance and Correlation: guides/performance-correlation.md
      - Runtime Configuration: guides/runtime-configuration.md
      - Development: guides/development.md
  - API Reference:
      - Overview: api/index.md
      - RoboBrowserContext: api/robo-browser-context.md
      - RoboPage: api/robo-page.md
      - RoboLocator: api/robo-locator.md
      - Browser Lifecycle: api/browser.md
      - Pytest Plugin: api/pytest-plugin.md
      - Performance: api/performance.md
      - Correlation: api/correlation.md
      - Configuration: api/config.md
      - Logging: api/logging.md
